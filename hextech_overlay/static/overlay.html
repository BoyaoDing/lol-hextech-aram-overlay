<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海克斯大乱斗 OBS 实时展示</title>
<style>
  :root {
    --silver-border: #98a4ae;
    --silver-glow: rgba(152, 164, 174, 0.28);
    --silver-tag: #c7d2dc;
    --gold-border: #e3cda7;
    --gold-glow: rgba(227, 205, 167, 0.30);
    --gold-tag: #f5dfb2;
    --prism-a: #f7d774;
    --prism-b: #8be9cf;
    --prism-c: #c99af5;
    --prism-d: #f7a8d8;
    --holo: linear-gradient(135deg, var(--prism-a), var(--prism-b), var(--prism-c), var(--prism-d));
    --bg-card: rgba(9, 14, 24, 0.86);
    --bg-header: rgba(9, 14, 24, 0.82);
    --ink: #f4f7fb;
    --muted: #a6b4c8;
    --unknown: #8a95a5;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  #stage {
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    transform-origin: top left;
  }

  #stage[data-align="right"] {
    align-items: flex-end;
    transform-origin: top right;
  }

  #stage[data-align="center"] {
    align-items: center;
    transform-origin: top center;
  }

  .header-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--bg-header);
    border: 1px solid rgba(200, 170, 110, 0.45);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #e6d7b3;
    backdrop-filter: blur(6px);
  }

  .header-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }

  .header-pill.picking .header-dot {
    background: #fbbf24;
    box-shadow: 0 0 10px #fbbf24;
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.65; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes holoShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #list {
    display: flex;
    gap: 8px;
  }

  /* Theme: vertical & showcase */
  #stage[data-theme="vertical"] #list,
  #stage[data-theme="showcase"] #list {
    flex-direction: column;
    width: 320px;
  }

  #stage[data-theme="tray"] #list {
    flex-direction: row;
    flex-wrap: wrap;
    max-width: 960px;
  }

  #stage[data-theme="strip"] #list {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 980px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 8px 12px 8px 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid var(--unknown);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    animation: slideIn 0.35s cubic-bezier(0.2, 0.85, 0.3, 1) both;
  }

  .card.silver {
    border-left-color: var(--silver-border);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), inset 0 0 18px rgba(152, 164, 174, 0.08);
  }

  .card.gold {
    border-left-color: var(--gold-border);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.52), inset 0 0 22px rgba(227, 205, 167, 0.10);
  }

  .card.prismatic {
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, var(--prism-a), var(--prism-b), var(--prism-c), var(--prism-d)) 1;
    border-top: 1px solid rgba(201, 154, 245, 0.30);
    border-right: 1px solid rgba(139, 233, 207, 0.22);
    border-bottom: 1px solid rgba(247, 168, 216, 0.26);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.56), inset 0 0 24px rgba(180, 150, 255, 0.12);
  }

  .icon-box {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.10);
  }

  .card.silver .icon-box {
    border-color: rgba(152, 164, 174, 0.45);
    background: rgba(152, 164, 174, 0.10);
  }

  .card.gold .icon-box {
    border-color: rgba(227, 205, 167, 0.50);
    background: rgba(227, 205, 167, 0.11);
  }

  .card.prismatic .icon-box {
    border-color: rgba(201, 154, 245, 0.55);
    background: linear-gradient(135deg, rgba(247, 215, 116, 0.14), rgba(139, 233, 207, 0.14), rgba(201, 154, 245, 0.16));
  }

  .icon-glyph {
    width: 32px;
    height: 32px;
    background: var(--unknown);
    -webkit-mask: var(--icon) center / contain no-repeat;
    mask: var(--icon) center / contain no-repeat;
  }

  .card.silver .icon-glyph {
    background: var(--silver-border);
  }

  .card.gold .icon-glyph {
    background: var(--gold-border);
  }

  .card.prismatic .icon-glyph {
    background: var(--holo);
    background-size: 200% 200%;
    animation: holoShift 4s ease infinite;
  }

  .meta {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }

  .badges {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex: none;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    color: #d4deec;
  }

  .card.silver .badge.rarity { color: var(--silver-tag); }
  .card.gold .badge.rarity { color: var(--gold-tag); }
  .card.prismatic .badge.rarity {
    background: linear-gradient(135deg, rgba(247, 215, 116, 0.22), rgba(201, 154, 245, 0.25));
    color: #fff3fd;
  }

  .desc {
    font-size: 12px;
    line-height: 1.38;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Tray theme refinements */
  #stage[data-theme="tray"] .card {
    width: 220px;
    padding: 7px 10px;
  }

  #stage[data-theme="tray"] .icon-box {
    width: 34px;
    height: 34px;
  }

  #stage[data-theme="tray"] .icon-glyph {
    width: 26px;
    height: 26px;
  }

  #stage[data-theme="tray"] .desc {
    -webkit-line-clamp: 1;
    font-size: 11px;
  }

  /* Strip theme refinements */
  #stage[data-theme="strip"] .card {
    padding: 5px 10px 5px 7px;
    border-radius: 999px;
    border-left-width: 3px;
    gap: 7px;
  }

  #stage[data-theme="strip"] .icon-box {
    width: 24px;
    height: 24px;
    border-radius: 50%;
  }

  #stage[data-theme="strip"] .icon-glyph {
    width: 18px;
    height: 18px;
  }

  #stage[data-theme="strip"] .name {
    font-size: 13px;
  }

  #stage[data-theme="strip"] .desc,
  #stage[data-theme="strip"] .badge.rarity {
    display: none;
  }

  /* Showcase Toast for newly acquired augments */
  #toast {
    margin-top: 10px;
    width: 340px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(11, 18, 32, 0.94);
    border: 1px solid rgba(200, 170, 110, 0.65);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
    display: none;
    animation: slideIn 0.35s ease both;
  }

  #toast.visible {
    display: block;
  }

  .toast-kicker {
    font-size: 11px;
    font-weight: 700;
    color: #f5d68a;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .toast-body {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .toast-desc {
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.45;
    color: #d6e0ee;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
<div id="stage" data-theme="vertical" data-align="left">
  <div id="header" class="header-pill hidden">
    <span class="header-dot"></span>
    <span id="header-text"></span>
  </div>
  <div id="list"></div>
  <div id="toast">
    <div class="toast-kicker">刚刚获得海克斯强化</div>
    <div class="toast-body">
      <div class="icon-box" id="toast-icon-box"><div class="icon-glyph" id="toast-icon"></div></div>
      <div class="meta">
        <div class="title-row">
          <div class="name" id="toast-name"></div>
          <span class="badge" id="toast-rarity"></span>
        </div>
        <div class="toast-desc" id="toast-desc"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const RARITY_LABEL = {
    silver: "白银",
    gold: "黄金",
    prismatic: "棱彩",
    unknown: "强化"
  };

  const params = new URLSearchParams(location.search);
  const queryOverrides = {
    theme: params.get("theme"),
    align: params.get("align"),
    desc: params.has("desc") ? params.get("desc") !== "0" : null,
    level: params.has("level") ? params.get("level") !== "0" : null,
    header: params.has("header") ? params.get("header") !== "0" : null,
    scale: params.has("scale") ? Number(params.get("scale")) : null,
    max: params.has("max") ? Number(params.get("max")) : null
  };

  const stageEl = document.getElementById("stage");
  const headerEl = document.getElementById("header");
  const headerTextEl = document.getElementById("header-text");
  const listEl = document.getElementById("list");
  const toastEl = document.getElementById("toast");
  const toastNameEl = document.getElementById("toast-name");
  const toastDescEl = document.getElementById("toast-desc");
  const toastRarityEl = document.getElementById("toast-rarity");
  const toastIconEl = document.getElementById("toast-icon");

  let seenPickUids = new Set();
  let initializedPicks = false;
  let toastTimer = null;

  function iconUrl(path) {
    if (!path) return "/api/icon/fallback";
    return "/api/icon/" + path.replace(/^\/+/, "");
  }

  function showToast(pick) {
    toastNameEl.textContent = pick.name;
    toastRarityEl.textContent = RARITY_LABEL[pick.rarity] || "强化";
    toastDescEl.textContent = pick.description || "已装备该海克斯强化";
    toastIconEl.style.setProperty("--icon", `url("${iconUrl(pick.icon_path)}")`);
    toastIconEl.style.background =
      pick.rarity === "prismatic"
        ? "var(--holo)"
        : pick.rarity === "gold"
          ? "var(--gold-border)"
          : "var(--silver-border)";
    toastEl.classList.add("visible");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("visible"), 5200);
  }

  function render(state, config) {
    const theme = queryOverrides.theme || config.theme || "vertical";
    const align = queryOverrides.align || config.align || "left";
    const showDesc = queryOverrides.desc ?? config.show_description;
    const showLevel = queryOverrides.level ?? config.show_level_badge;
    const showHeader = queryOverrides.header ?? config.show_champion_header;
    const scale = Number.isFinite(queryOverrides.scale) && queryOverrides.scale > 0
      ? queryOverrides.scale
      : (config.scale || 1.0);
    const maxVisible = Number.isFinite(queryOverrides.max) && queryOverrides.max > 0
      ? queryOverrides.max
      : (config.max_visible || 6);

    stageEl.dataset.theme = theme;
    stageEl.dataset.align = align;
    stageEl.style.transform = `scale(${scale})`;

    const picks = (state.picks || []).slice(-maxVisible);
    const picking = Array.isArray(state.candidates) && state.candidates.length > 0;

    if (showHeader && (picks.length > 0 || picking || state.champion_name)) {
      const champ = state.champion_name || state.champion_alias || "海克斯大乱斗";
      const suffix = picking ? "正在选择海克斯..." : `已选 ${state.picks.length} 个海克斯`;
      headerTextEl.textContent = `${champ} · ${suffix}`;
      headerEl.classList.toggle("picking", picking);
      headerEl.classList.remove("hidden");
    } else {
      headerEl.classList.add("hidden");
    }

    listEl.innerHTML = "";
    for (const pick of picks) {
      const card = document.createElement("div");
      card.className = `card ${pick.rarity || "unknown"}`;

      const iconBox = document.createElement("div");
      iconBox.className = "icon-box";
      const glyph = document.createElement("div");
      glyph.className = "icon-glyph";
      glyph.style.setProperty("--icon", `url("${iconUrl(pick.icon_path)}")`);
      iconBox.appendChild(glyph);

      const meta = document.createElement("div");
      meta.className = "meta";

      const titleRow = document.createElement("div");
      titleRow.className = "title-row";

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = pick.name;

      const badges = document.createElement("div");
      badges.className = "badges";
      const rarityBadge = document.createElement("span");
      rarityBadge.className = "badge rarity";
      rarityBadge.textContent = RARITY_LABEL[pick.rarity] || "强化";
      badges.appendChild(rarityBadge);

      if (showLevel && pick.level) {
        const lvlBadge = document.createElement("span");
        lvlBadge.className = "badge";
        lvlBadge.textContent = `Lv.${pick.level}`;
        badges.appendChild(lvlBadge);
      }

      titleRow.appendChild(nameEl);
      titleRow.appendChild(badges);
      meta.appendChild(titleRow);

      if (showDesc && pick.description && theme !== "strip") {
        const descEl = document.createElement("div");
        descEl.className = "desc";
        descEl.textContent = pick.description;
        meta.appendChild(descEl);
      }

      card.appendChild(iconBox);
      card.appendChild(meta);
      listEl.appendChild(card);
    }

    // Trigger spotlight toast when a brand-new pick arrives in showcase mode
    const allPicks = state.picks || [];
    if (!initializedPicks) {
      allPicks.forEach(p => seenPickUids.add(p.uid));
      initializedPicks = true;
    } else {
      const newest = allPicks.filter(p => !seenPickUids.has(p.uid));
      allPicks.forEach(p => seenPickUids.add(p.uid));
      if (newest.length > 0 && theme === "showcase") {
        showToast(newest[newest.length - 1]);
      }
      if (allPicks.length === 0) {
        seenPickUids.clear();
        toastEl.classList.remove("visible");
      }
    }
  }

  async function bootstrap() {
    try {
      const res = await fetch("/api/state");
      if (res.ok) {
        const data = await res.json();
        render(data.state, data.config);
      }
    } catch (_) {}
  }

  let delay = 1000;
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => { delay = 1000; };
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === "snapshot") {
          render(msg.state, msg.config);
        }
      } catch (_) {}
    };
    ws.onclose = () => {
      setTimeout(connectWs, delay);
      delay = Math.min(5000, delay * 1.5);
    };
    ws.onerror = () => ws.close();
  }

  bootstrap();
  connectWs();
})();
</script>
</body>
</html>
